cluster:
  etcd:
    advertisedSubnets:
      - fd00:10:20::/64
      - 10.20.0.0/24
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  wipe: true
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: drbd
parameters:
  - usermode_helper=disabled
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: drbd_transport_tcp
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: dm-thin-pool
---
apiVersion: v1alpha1
kind: KubeletConfig
config:
  shutdownGracePeriod: 120s
  shutdownGracePeriodCriticalPods: 60s
defaultRuntimeSeccompProfileEnabled: true
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  zone: home
nodeIP:
  validSubnets:
    - fd00:10:20::/64
    - 10.20.0.0/24
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
  - fd00:10:30::/56
  - 10.30.0.0/16
serviceSubnets:
  - fd00:10:96::/108
  - 10.96.0.0/12
---
apiVersion: v1alpha1
kind: VolumeConfig
name: STATE
encryption:
  provider: luks2
  keys:
    - slot: 0
      tpm:
        checkSecurebootStatusOnEnroll: true
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
encryption:
  provider: luks2
  keys:
    - slot: 0
      tpm:
        checkSecurebootStatusOnEnroll: true
      lockToState: true
---
apiVersion: v1alpha1
kind: ResolverConfig
hostDNS:
  enabled: true
  forwardKubeDNSToHost: true
nameservers:
  - address: fd00:10:20:0:c6ad:34ff:fe8d:7f26
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  user.max_user_namespaces: "11255"
  net.ipv6.conf.all.use_tempaddr: "0"
  net.ipv6.conf.default.use_tempaddr: "0"
---
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: containerd
content: |
  [plugins."io.containerd.cri.v1.images"]
    discard_unpacked_layers = false
---
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
configuration:
  apiVersion: pod-security.admission.config.k8s.io/v1alpha1
  defaults:
    audit: restricted
    audit-version: latest
    enforce: baseline
    enforce-version: latest
    warn: restricted
    warn-version: latest
  exemptions:
    namespaces:
      - piraeus-system
    runtimeClasses: []
    usernames: []
  kind: PodSecurityConfiguration
---
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: true
---
apiVersion: v1alpha1
kind: WatchdogTimerConfig
device: /dev/watchdog0
timeout: 2m
---
apiVersion: v1alpha1
kind: FilesystemTrimConfig
interval: 168h0m0s
---
apiVersion: v1alpha1
kind: FilesystemScrubConfig
interval: 168h0m0s
---
apiVersion: v1alpha1
kind: VethConfig
name: veth-workload
addresses:
  - address: fda1:b2c3:d4e5:1::/127
peer:
  name: veth-router
  addresses:
    - address: fda1:b2c3:d4e5:1::1/127
---
apiVersion: v1alpha1
kind: VRFConfig
name: vrf-workload
links:
  - veth-router
table: "88"
