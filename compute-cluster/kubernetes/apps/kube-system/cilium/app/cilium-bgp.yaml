---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: workload-routes
  labels:
    bgp.example.com/advertisement: workload-routes
spec:
  advertisements:
    - advertisementType: Service
      selector:
        matchExpressions:
          - { key: somekey, operator: NotIn, values: ["never-used-value"] }
      service:
        addresses:
          - LoadBalancerIP
    - advertisementType: PodCIDR
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: talos-workload
spec:
  families:
    - afi: ipv6
      safi: unicast
      advertisements:
        matchLabels:
          bgp.example.com/advertisement: workload-routes
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          bgp.example.com/advertisement: workload-routes
  gracefulRestart:
    enabled: true
  transport:
    peerPort: 179
    sourceInterface: veth-workload
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: talos-workload
spec:
  bgpInstances:
    - name: talos-workload
      localASN: 4200000003
      peers:
        - name: talos-workload
          peerASN: 4200000002
          peerAddress: "fda1:b2c3:d4e5:1::1"
          peerConfigRef:
            name: talos-workload
  nodeSelector:
    matchLabels:
      zone: home
