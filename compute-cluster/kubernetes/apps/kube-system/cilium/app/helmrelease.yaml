---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    bandwidthManager:
      enabled: true
      bbr: true
    bgpControlPlane:
      enabled: true
    bpf:
      datapathMode: netkit
      distributedLRU:
        enabled: true
      mapDynamicSizeRatio: 0.08
      masquerade: false
      preallocateMaps: true
    bpfClockProbe: true
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    dashboards:
      enabled: true
    enableIPv4BIGTCP: true
    enableIPv4Masquerade: false
    enableIPv6BIGTCP: true
    enableIPv6Masquerade: false
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    hubble:
      relay:
        enabled: true
        prometheus:
          serviceMonitor:
            enabled: true
        replicas: 2
        rollOutPods: true
      ui:
        enabled: true
        replicas: 2
        rollOutPods: true
    gatewayAPI:
      enabled: false
    ipam:
      mode: kubernetes
    ipv6:
      enabled: true
    k8sServiceHost: localhost
    k8sServicePort: 7445
    kubeProxyReplacement: true
    l7Proxy: false
    loadBalancer:
      acceleration: best-effort
      algorithm: maglev
      mode: dsr
    localRedirectPolicies:
      enabled: true
    operator:
      replicas: 2
      dashboards:
        enabled: true
      prometheus:
        serviceMonitor:
          enabled: true
      rollOutPods: true
    pmtuDiscovery:
      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          [
            CHOWN,
            KILL,
            NET_ADMIN,
            NET_RAW,
            IPC_LOCK,
            SYS_ADMIN,
            SYS_RESOURCE,
            DAC_OVERRIDE,
            FOWNER,
            SETGID,
            SETUID,
          ]
        cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
