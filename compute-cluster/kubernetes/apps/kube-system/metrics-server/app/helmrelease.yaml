---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  chartRef:
    kind: OCIRepository
    name: metrics-server
  interval: 1h
  values:
    apiService:
      insecureSkipTLSVerify: false
    metrics:
      enabled: true
    replicas: 2
    serviceMonitor:
      enabled: true
    tls:
      type: cert-manager
