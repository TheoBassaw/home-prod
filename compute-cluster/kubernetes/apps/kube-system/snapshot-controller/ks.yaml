---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snapshot-controller
  namespace: kube-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./compute-cluster/kubernetes/apps/kube-system/snapshot-controller/app
  prune: false
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
