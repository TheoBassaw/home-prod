---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: pod-hostname-antiaffinity
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
  matchConditions:
    - name: has-app-label
      expression: "'app.kubernetes.io/name' in object.metadata.labels"
    - name: no-existing-required-antiaffinity
      expression: |
        !has(object.spec.affinity) ||
        !has(object.spec.affinity.podAntiAffinity) ||
        !has(object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution) ||
        object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.size() == 0
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          !has(object.spec.affinity)
          ? [
              JSONPatch{
                op: "add",
                path: "/spec/affinity",
                value: Object.spec.affinity{
                  podAntiAffinity: Object.spec.affinity.podAntiAffinity{
                    requiredDuringSchedulingIgnoredDuringExecution: [
                      Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution{
                        labelSelector: Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.labelSelector{
                          matchExpressions: [
                            Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.labelSelector.matchExpressions{
                              key: "app.kubernetes.io/name",
                              operator: "In",
                              values: [object.metadata.labels["app.kubernetes.io/name"]]
                            }
                          ] + (
                            "app.kubernetes.io/component" in object.metadata.labels
                            ? [
                                Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.labelSelector.matchExpressions{
                                  key: "app.kubernetes.io/component",
                                  operator: "In",
                                  values: [object.metadata.labels["app.kubernetes.io/component"]]
                                }
                              ]
                            : []
                          )
                        },
                        topologyKey: "kubernetes.io/hostname"
                      }
                    ]
                  }
                }
              }
            ]
          : !has(object.spec.affinity.podAntiAffinity)
          ? [
              JSONPatch{
                op: "add",
                path: "/spec/affinity/podAntiAffinity",
                value: Object.spec.affinity.podAntiAffinity{
                  requiredDuringSchedulingIgnoredDuringExecution: [
                    Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution{
                      labelSelector: Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.labelSelector{
                        matchExpressions: [
                          Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.labelSelector.matchExpressions{
                            key: "app.kubernetes.io/name",
                            operator: "In",
                            values: [object.metadata.labels["app.kubernetes.io/name"]]
                          }
                        ] + (
                          "app.kubernetes.io/component" in object.metadata.labels
                          ? [
                              Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.labelSelector.matchExpressions{
                                key: "app.kubernetes.io/component",
                                operator: "In",
                                values: [object.metadata.labels["app.kubernetes.io/component"]]
                              }
                            ]
                          : []
                        )
                      },
                      topologyKey: "kubernetes.io/hostname"
                    }
                  ]
                }
              }
            ]
          : !has(object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution)
          ? [
              JSONPatch{
                op: "add",
                path: "/spec/affinity/podAntiAffinity/requiredDuringSchedulingIgnoredDuringExecution",
                value: [
                  Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution{
                    labelSelector: Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.labelSelector{
                      matchExpressions: [
                        Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.labelSelector.matchExpressions{
                          key: "app.kubernetes.io/name",
                          operator: "In",
                          values: [object.metadata.labels["app.kubernetes.io/name"]]
                        }
                      ] + (
                        "app.kubernetes.io/component" in object.metadata.labels
                        ? [
                            Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.labelSelector.matchExpressions{
                              key: "app.kubernetes.io/component",
                              operator: "In",
                              values: [object.metadata.labels["app.kubernetes.io/component"]]
                            }
                          ]
                        : []
                      )
                    },
                    topologyKey: "kubernetes.io/hostname"
                  }
                ]
              }
            ]
          : [
              JSONPatch{
                op: "add",
                path: "/spec/affinity/podAntiAffinity/requiredDuringSchedulingIgnoredDuringExecution/-",
                value: Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution{
                  labelSelector: Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.labelSelector{
                    matchExpressions: [
                      Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.labelSelector.matchExpressions{
                        key: "app.kubernetes.io/name",
                        operator: "In",
                        values: [object.metadata.labels["app.kubernetes.io/name"]]
                      }
                    ] + (
                      "app.kubernetes.io/component" in object.metadata.labels
                      ? [
                          Object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.labelSelector.matchExpressions{
                            key: "app.kubernetes.io/component",
                            operator: "In",
                            values: [object.metadata.labels["app.kubernetes.io/component"]]
                          }
                        ]
                      : []
                    )
                  },
                  topologyKey: "kubernetes.io/hostname"
                }
              }
            ]
