---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: helmrelease-defaults
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups:
          - helm.toolkit.fluxcd.io
        apiVersions:
          - v2
        operations:
          - CREATE
          - UPDATE
        resources:
          - helmreleases
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            spec: Object.spec{
              install: Object.spec.install{
                crds: "CreateReplace"
              },
              rollback: Object.spec.rollback{
                cleanupOnFail: true
              },
              upgrade: Object.spec.upgrade{
                cleanupOnFail: true,
                crds: "CreateReplace",
                strategy: Object.spec.upgrade.strategy{
                  name: "RemediateOnFailure"
                },
                remediation: Object.spec.upgrade.remediation{
                  remediateLastFailure: true,
                  retries: 2
                }
              }
            }
          }
