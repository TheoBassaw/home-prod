---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: admission-policies
  namespace: kube-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./compute-cluster/kubernetes/apps/kube-system/admission-policies/app
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
