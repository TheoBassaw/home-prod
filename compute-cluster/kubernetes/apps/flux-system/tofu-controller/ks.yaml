---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tofu-controller
  namespace: flux-system
spec:
  interval: 1h
  path: ./compute-cluster/kubernetes/apps/flux-system/tofu-controller/app
  retryInterval: 1m
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  wait: true
