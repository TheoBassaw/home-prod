---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  components:
    - helm-controller
    - kustomize-controller
    - notification-controller
    - source-controller
  cluster:
    domain: cluster.local
    multitenant: false
    networkPolicy: true
    type: kubernetes
  distribution:
    registry: ghcr.io/fluxcd
    version: 2.x
  sync:
    kind: OCIRepository
    url: oci://ghcr.io/theobassaw/home-prod
    ref: latest
    path: ./compute-cluster/kubernetes/apps
    interval: 1h
