---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  components:
    - helm-controller
    - kustomize-controller
    - notification-controller
    - source-controller
  cluster:
    domain: cluster.local
    multitenant: false
    networkPolicy: true
    type: kubernetes
  distribution:
    registry: ghcr.io/fluxcd
    version: 2.8.x
  kustomize:
    patches:
      - patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --concurrent=10
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --requeue-dependency=5s
        target:
          kind: Deployment
          name: "(kustomize-controller|helm-controller|source-controller)"
  sync:
    kind: OCIRepository
    url: oci://ghcr.io/theobassaw/home-prod
    ref: latest
    path: ./compute-cluster/kubernetes/apps
    interval: 1h
