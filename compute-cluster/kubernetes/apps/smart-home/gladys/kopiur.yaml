---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gladys-kopiur
  namespace: smart-home
spec:
  interval: 1h
  path: ./compute-cluster/kubernetes/components/kopiur
  postBuild:
    substitute:
      APP: gladys
      CAPACITY: 10Gi
      STORAGECLASS: piraeus-replicated
      ACCESSMODE: ReadWriteOnce
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: smart-home
  wait: false
