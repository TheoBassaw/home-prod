---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gladys
  namespace: smart-home
spec:
  parentRefs:
    - name: envoy
      namespace: network-system
  hostnames:
    - gladys.paradisenetworkz.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gladys
          port: 80
