---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant-kopiur
  namespace: smart-home
spec:
  interval: 1h
  path: ./compute-cluster/kubernetes/components/kopiur
  postBuild:
    substitute:
      APP: home-assistant
      MOVER_FSGROUP: "1000"
      MOVER_RUNASGROUP: "1000"
      MOVER_RUNASUSER: "1000"
      STORAGECLASS: piraeus-replicated
      ACCESSMODE: ReadWriteOnce
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: smart-home
  timeout: 5m
  wait: false
