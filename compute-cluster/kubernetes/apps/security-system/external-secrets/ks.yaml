---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: security-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./compute-cluster/kubernetes/apps/security-system/external-secrets/app
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
