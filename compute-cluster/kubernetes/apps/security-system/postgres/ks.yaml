---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres
  namespace: security-system
spec:
  dependsOn:
    - name: cloudnative-pg
      namespace: storage-system
  components:
    - ../../../../components/postgres/backup
  postBuild:
    substitute:
      NAMESPACE: security-system
  interval: 1h
  retryInterval: 1m
  path: ./compute-cluster/kubernetes/apps/security-system/postgres/app
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
