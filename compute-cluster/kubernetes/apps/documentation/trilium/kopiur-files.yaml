---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: trilium-files-kopiur
  namespace: documentation
spec:
  interval: 1h
  path: ./compute-cluster/kubernetes/components/kopiur
  postBuild:
    substitute:
      ACCESSMODE: ReadWriteMany
      APP: trilium-files
      CAPACITY: 10Gi
      STORAGECLASS: piraeus-replicated-rwx
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: documentation
  timeout: 5m
  wait: false
