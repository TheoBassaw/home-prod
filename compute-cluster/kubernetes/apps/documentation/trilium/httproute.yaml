---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trilium
  namespace: documentation
spec:
  hostnames:
    - trilium.paradisenetworkz.com
  parentRefs:
    - name: envoy
      namespace: network-system
      sectionName: https
  rules:
    - backendRefs:
        - name: trilium
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
