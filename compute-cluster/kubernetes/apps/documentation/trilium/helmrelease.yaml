---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trilium
  namespace: documentation
spec:
  chartRef:
    kind: OCIRepository
    name: trilium
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    permissions:
      uid: 1000
      gid: 1000
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: trilium-db
      files:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: trilium-files
        globalMounts:
          - path: /home/node/trilium-data/files
    configini:
      general:
        noBackup: true
      network:
        host: "::"
        trustedReverseProxy: true
    service:
      main:
        ports:
          http:
            port: 8080
    ingress:
      main:
        enabled: false
