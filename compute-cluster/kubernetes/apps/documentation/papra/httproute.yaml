---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: papra
  namespace: documentation
spec:
  hostnames:
    - papra.paradisenetworkz.com
  parentRefs:
    - name: envoy
      namespace: network-system
  rules:
    - backendRefs:
        - name: papra
          port: 1221
      matches:
        - path:
            type: PathPrefix
            value: /
