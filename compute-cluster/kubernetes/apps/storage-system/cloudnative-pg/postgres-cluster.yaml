---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: storage-system
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-minimal-trixie
  instances: 3
  primaryUpdateStrategy: unsupervised
  storage:
    size: 5Gi
    storageClass: piraeus-local
  enableSuperuserAccess: true
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  certificates:
    serverTLSSecret: postgres-server-cert
    serverCASecret: postgres-server-cert
    replicationTLSSecret: postgres-client-cert
    clientCASecret: postgres-client-cert
  postgresql:
    pg_hba:
      - hostssl all all all cert
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backblaze
  bootstrap:
    recovery:
      source: origin
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: backblaze
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: backblaze
  namespace: storage-system
spec:
  retentionPolicy: "7d"
  configuration:
    destinationPath: s3://home-prod-kubernetes/cloudnative-pg
    endpointURL: https://s3.us-west-004.backblazeb2.com
    s3Credentials:
      accessKeyId:
        name: s3-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: s3-credentials
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: zstd
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-hourly
  namespace: storage-system
spec:
  immediate: true
  schedule: "0 0 * * * *" # 4 AM EST
  backupOwnerReference: self
  cluster:
    name: postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
