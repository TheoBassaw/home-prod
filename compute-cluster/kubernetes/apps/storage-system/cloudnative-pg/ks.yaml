---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: storage-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./compute-cluster/kubernetes/apps/storage-system/cloudnative-pg/app
  prune: false
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
