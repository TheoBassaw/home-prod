---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: backblaze
spec:
  backend:
    s3:
      bucket: home-prod-kubernetes
      prefix: kopiur/
      endpoint: s3.us-west-004.backblazeb2.com
      region: us-west-004
      auth:
        secretRef:
          name: s3-credentials
          namespace: storage-system
  encryption:
    passwordSecretRef:
      name: kopia-secret
      namespace: storage-system
      key: KOPIA_PASSWORD
  create:
    enabled: true
  allowedNamespaces:
    all: true
  identityDefaults:
    hostnameExpr: "namespace"
    usernameExpr: "namespace + '-' + policyName"
  credentialProjection:
    allowed: true
