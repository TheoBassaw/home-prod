---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator
  namespace: observability-system
spec:
  dependsOn:
    - name: postgres
      namespace: observability-system
  components:
    - ../../../../components/postgres/db
  postBuild:
    substitute:
      APP: grafana
  interval: 1h
  retryInterval: 1m
  path: ./compute-cluster/kubernetes/apps/observability-system/grafana-operator/app
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
