---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: observability-system
  labels:
    dashboards: grafana
spec:
  disableDefaultAdminSecret: true
  disableDefaultSecurityContext: All
  deployment:
    spec:
      strategy:
        type: Recreate
      replicas: 2
      template:
        spec:
          volumes:
            - name: pg-client-cert
              secret:
                secretName: grafana-client-cert
                defaultMode: 0440
            - name: pg-server-ca
              secret:
                secretName: postgres-ca
                defaultMode: 0444
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password-secret
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
              volumeMounts:
                - name: pg-client-cert
                  mountPath: /var/run/secrets/postgresql
                  readOnly: true
                - name: pg-server-ca
                  mountPath: /var/run/secrets/postgresql-ca
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
  config:
    log:
      mode: "console"
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "false"
    auth.anonymous:
      enabled: "True"
    database:
      type: "postgres"
      host: "postgres-rw.observability-system:5432"
      name: "grafana"
      user: "grafana"
      ssl_mode: "verify-full"
      client_cert_path: "/var/run/secrets/postgresql/tls.crt"
      client_key_path: "/var/run/secrets/postgresql/tls.key"
      ca_cert_path: "/var/run/secrets/postgresql-ca/ca.crt"
    unified_alerting:
      enabled: "true"
      ha_peers: "grafana-alerting:9094"
    metrics:
      enabled: "true"
    server:
      enable_gzip: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
  httpRoute:
    spec:
      parentRefs:
        - name: envoy
          namespace: network-system
      hostnames:
        - grafana.paradisenetworkz.com
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: grafana-service
              port: 3000
