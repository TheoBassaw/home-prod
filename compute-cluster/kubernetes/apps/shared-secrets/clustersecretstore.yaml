---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: shared-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: shared-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: shared-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets-kubernetes-shared-secrets
          namespace: shared-secrets
