---
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: linstor-satellite-configuration
  namespace: piraeus-system
spec:
  internalTLS:
    certManager:
      name: root-ca-clusterissuer
      kind: ClusterIssuer
    tlsHandshakeDaemon: true
  storagePools:
    - name: vg-pool
      lvmPool:
        volumeGroup: vg-pool
  podTemplate:
    spec:
      containers:
        - name: linstor-satellite
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    exec 1>>/proc/1/fd/1 2>>/proc/1/fd/2
                    for r in $(drbdsetup status | awk '/^[^ ]/ {print $1}'); do
                      if drbdsetup status "$r" --verbose | grep -q 'open:yes'; then
                        echo "preStop: $r in use, leaving it up"
                        continue
                      fi
                      drbdadm secondary "$r" || true
                      drbdadm down "$r" || true
                    done
      initContainers:
        - name: drbd-shutdown-guard
          $patch: delete
        - name: drbd-module-loader
          $patch: delete
      volumes:
        - name: run-systemd-system
          $patch: delete
        - name: run-drbd-shutdown-guard
          $patch: delete
        - name: systemd-bus-socket
          $patch: delete
        - name: lib-modules
          $patch: delete
        - name: usr-src
          $patch: delete
        - name: etc-lvm-backup
          hostPath:
            path: /var/etc/lvm/backup
            type: DirectoryOrCreate
        - name: etc-lvm-archive
          hostPath:
            path: /var/etc/lvm/archive
            type: DirectoryOrCreate
