---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: not-used
      spec:
        install:
          crds: CreateReplace
        rollback:
          cleanupOnFail: true
        upgrade:
          cleanupOnFail: true
          crds: CreateReplace
          strategy:
            name: RemediateOnFailure
          remediation:
            remediateLastFailure: true
            retries: 2
        postRenderers:
          - kustomize:
              patches:
                - target:
                    kind: Service
                  patch: |
                    - op: add
                      path: /spec/ipFamilyPolicy
                      value: RequireDualStack
