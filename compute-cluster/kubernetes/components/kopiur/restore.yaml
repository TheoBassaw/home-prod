---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  credentialProjection:
    enabled: true
  policy:
    onMissingSnapshot: Continue
  mover:
    securityContext:
      runAsUser: ${MOVER_RUNASUSER:=1000}
      runAsGroup: ${MOVER_RUNASGROUP:=1000}
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      privileged: false
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      fsGroup: ${MOVER_FSGROUP:=1000}
      fsGroupChangePolicy: OnRootMismatch
  source:
    fromPolicy:
      name: ${APP}
      offset: 0
  target:
    populator: {}
