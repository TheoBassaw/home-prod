---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd
  repository:
    kind: ClusterRepository
    name: backblaze
  retention:
    keepHourly: 24
    keepDaily: 7
  mover:
    securityContext:
      runAsUser: ${MOVER_RUNASUSER:=1000}
      runAsGroup: ${MOVER_RUNASGROUP:=1000}
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      privileged: false
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      fsGroup: ${MOVER_FSGROUP:=1000}
      fsGroupChangePolicy: OnRootMismatch
  sources:
    - pvc:
        name: ${APP}
  volumeSnapshotClassName: piraeus
  credentialProjection:
    enabled: true
