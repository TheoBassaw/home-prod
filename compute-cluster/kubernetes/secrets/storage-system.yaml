---
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: storage-system
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
---
apiVersion: v1
kind: Secret
metadata:
  name: kopia-secret
  namespace: storage-system
type: Opaque
stringData:
  KOPIA_PASSWORD: ${KOPIA_PASSWORD}
