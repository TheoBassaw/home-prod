[providers.pass]
type   = "password-store"
prefix = "home-prod/compute-cluster/kubernetes/"

[secrets]
CLOUDFLARE_TOKEN           = { provider = "pass", value = "network-system/CLOUDFLARE_TOKEN" }
GF_SECURITY_ADMIN_PASSWORD = { provider = "pass", value = "observability-system/GF_SECURITY_ADMIN_PASSWORD" }
S3_ACCESS_KEY              = { provider = "pass", value = "S3_ACCESS_KEY" }
S3_SECRET_KEY              = { provider = "pass", value = "S3_SECRET_KEY" }
