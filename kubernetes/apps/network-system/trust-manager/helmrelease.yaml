---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: network-system
spec:
  chartRef:
    kind: OCIRepository
    name: trust-manager
  dependsOn:
    - name: cert-manager
  interval: 1h
  values:
    crds:
      enabled: true
    replicaCount: 2
    app:
      trust:
        namespace: "network-system"
