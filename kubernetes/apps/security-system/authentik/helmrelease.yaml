---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: security-system
spec:
  chartRef:
    kind: OCIRepository
    name: authentik
  interval: 1h
  values:
    global:
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret-key
              key: password
        - name: AUTHENTIK_POSTGRESQL__SSLMODE
          value: verify-full
        - name: AUTHENTIK_POSTGRESQL__SSLCERT
          value: /var/run/secrets/postgresql/tls.crt
        - name: AUTHENTIK_POSTGRESQL__SSLKEY
          value: /var/run/secrets/postgresql/tls.key
        - name: AUTHENTIK_POSTGRESQL__SSLROOTCERT
          value: /var/run/secrets/postgres/ca.crt
      volumes:
        - name: pg-client-cert
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: root-ca-clusterissuer
              csi.cert-manager.io/issuer-kind: ClusterIssuer
              csi.cert-manager.io/common-name: authentik
              csi.cert-manager.io/key-usages: client auth
              csi.cert-manager.io/fs-group: "1000"
      volumeMounts:
        - name: pg-client-cert
          mountPath: /var/run/secrets/postgresql
    authentik:
      postgresql:
        host: postgres-rw.storage-system
        name: authentik
        user: authentik
    server:
      replicas: 2
      route:
        main:
          enabled: true
          parentRefs:
            - name: envoy
              namespace: network-system
          hostnames:
            - authentik.home.paradisenetworkz.com
    worker:
      replicas: 2
