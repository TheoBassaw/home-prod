---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-secret-store
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.com.
      identityURL: https://identity.bitwarden.com.
      auth:
        secretRef:
          credentials:
            key: BITWARDEN_ACCESS_TOKEN
            name: bitwarden-access-token
            namespace: security-system
      bitwardenServerSDKURL: https://bitwarden-sdk-server.security-system.svc.cluster.local:9998
      caProvider:
        type: ConfigMap
        name: root-ca
        key: ca.crt
        namespace: network-system
      organizationID: fe3d4e33-20e4-45f7-aec5-b48c014121e3
      projectID: 9755e1d4-89f4-4dc2-838f-b48c01414989
