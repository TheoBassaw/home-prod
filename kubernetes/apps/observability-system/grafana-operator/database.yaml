---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-db
  namespace: observability-system
spec:
  interval: 1h
  path: ./kubernetes/components/postgres
  postBuild:
    substitute:
      APP: grafana
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: storage-system
  timeout: 5m
  wait: false
