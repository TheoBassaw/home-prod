---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-credentials
  namespace: storage-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secret-store
  target:
    name: s3-credentials
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: S3_SECRET_KEY
