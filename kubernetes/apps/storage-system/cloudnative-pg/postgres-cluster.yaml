---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: storage-system
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-minimal-trixie
  instances: 3
  primaryUpdateStrategy: unsupervised
  storage:
    size: 5Gi
    storageClass: miroir-local
  enableSuperuserAccess: true
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  certificates:
    serverTLSSecret: postgres-server-cert
    serverCASecret: postgres-server-cert
    replicationTLSSecret: postgres-client-cert
    clientCASecret: postgres-client-cert
  postgresql:
    pg_hba:
      - hostssl all all all cert
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: versity-truenas
  bootstrap:
    recovery:
      source: origin
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: versity-truenas
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: versity-truenas
  namespace: storage-system
spec:
  retentionPolicy: "8d"
  configuration:
    destinationPath: s3://postgres-backups
    endpointURL: https://truenas.paradisenetworkz.com:30157
    s3Credentials:
      accessKeyId:
        name: s3-credentials
        key: S3_ACCESS_KEY
      secretAccessKey:
        name: s3-credentials
        key: S3_SECRET_KEY
    wal:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-hourly
  namespace: storage-system
spec:
  immediate: true
  schedule: "0 0 * * * *" # 4 AM EST
  backupOwnerReference: self
  cluster:
    name: postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
