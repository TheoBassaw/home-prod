---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: APP
spec:
  secretName: APP
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - client auth
  commonName: APP
  issuerRef:
    name: root-ca-clusterissuer
    kind: ClusterIssuer
    group: cert-manager.io
